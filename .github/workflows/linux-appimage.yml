# The Linux AppImage (x86_64): ProjectReLink's builder with the compiler, Python, libraries and the Vulkan back end it
# builds the game with on the player's PC (scripts/linux/deps.sh, scripts/linux/appimage.sh). No game data is involved.
# Built in Ubuntu 22.04, the oldest system it is for (glibc 2.35). A workflow artifact on every run, and a release on
# main: the tag is the version the AppImage carries (git describe), so a release is named after the build it holds.
name: Linux AppImage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 90
    steps:
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for try in 1 2 3; do
            if apt-get update &&
              apt-get install -y --no-install-recommends software-properties-common gpg-agent &&
              add-apt-repository -y ppa:ubuntu-toolchain-r/test &&
              apt-get install -y --no-install-recommends g++-13 libstdc++-13-dev &&
              apt-get install -y --no-install-recommends git ca-certificates curl xz-utils zstd file unzip python3 \
              build-essential gcc-12 g++-12 libstdc++-12-dev nasm meson ninja-build cmake pkg-config \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxinerama-dev \
              libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
              libpulse-dev libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libxft-dev libfontconfig1-dev zlib1g-dev; then
              break
            else
              package_status=$?
            fi
            if [ "$try" = 3 ]; then exit "$package_status"; fi
            sleep 20
          done

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The window (scripts/linux/gui.py) is not self-contained: it reads make_game.py's lines and passes its options,
      # and that file belongs to upstream, which edits it often. A rename there (say @@eta becoming @@time) would build
      # and publish an AppImage whose time estimate and progress bar silently stop working: the window still opens, so
      # nothing looks broken. These are the words the two share; if one goes, the build stops before the release.
      - name: The window and make_game.py still speak the same language
        run: |
          missing=0
          for word in '@@stage' '@@progress' '@@eta' '@@plan' '@@file' '@@error' \
                      '--nup' '--romfs' '--exefs' '--out' '--language' '--log'; do
            if ! grep -q -- "$word" nx2/make_game.py; then
              echo "::error::make_game.py no longer has $word, which scripts/linux/gui.py uses"
              missing=1
            fi
          done
          [ "$missing" = 0 ] && echo "all 12 words the window and the builder share are there"

      - name: Version
        id: version
        run: |
          # The release this fork is on: the newest upstream tag that is a plain vX.Y.Z. git describe cannot say it
          # here: this workflow's own releases are tags too, and describe would pick the newest of those, so each
          # release would be named after the one before.
          #
          # The AppImage takes that version AS IT IS. It used to add "-linux.<commits since the tag>", which made a
          # new number for every commit; but a rebuilt AppImage of the same upstream release is a replacement, not a
          # new release, so a bad build is replaced in place instead of piling up versions.
          base=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          tag=${base:-v0}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "the AppImage is $tag"

      - uses: actions/cache@v4
        with:
          path: build-linux/deps
          key: linux-deps-${{ hashFiles('scripts/linux/deps.sh') }}

      - name: Dependencies (LLVM, Python, FFmpeg with dav1d, SDL2, Vulkan headers)
        run: scripts/linux/deps.sh

      - name: AppImage
        env:
          RELINK_VERSION: ${{ steps.version.outputs.tag }}
        run: scripts/linux/appimage.sh

      # The window and make_game.py are a package of scripts, not one file: AppRun starts gui.py with "python3 -I", and
      # isolated mode keeps the script's own directory out of sys.path. A missing side module (scene.py, theme.py,
      # updates.py) is then invisible to every check that does not run it the way AppRun does — v0.7.6 shipped with
      # "No module named 'scene'". This starts the window from the assembled AppDir, exactly as AppRun does, and fails
      # the build if it cannot come up.
      - name: The window starts
        run: |
          export QT_QPA_PLATFORM=offscreen
          python=$(ls -d build-linux/AppDir/usr/python/bin/python3)
          "$python" -I build-linux/AppDir/usr/share/relink/scripts/linux/gui.py &
          pid=$!
          sleep 12
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the window did not stay up: see the log above"
            wait "$pid" || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          echo "the window came up and stayed up"

      # The button itself: v0.7.6 shipped with a window that opened and an Install that did nothing, because a Qt slot
      # that raises is printed and then swallowed. Starting the window (above) cannot see that; this drives the slot
      # with the builder stubbed out.
      - name: The Install button does something
        env:
          RELINK_APPDIR: ${{ github.workspace }}/build-linux/AppDir
        run: |
          export QT_QPA_PLATFORM=offscreen
          build-linux/AppDir/usr/python/bin/python3 scripts/linux/selftest.py

      - uses: actions/upload-artifact@v4
        with:
          name: ReLink-linux-x86_64
          path: build-linux/*.AppImage
          if-no-files-found: error

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ReLink ${{ steps.version.outputs.tag }} — Linux AppImage
          body: |
            > [!WARNING]
            > **This build is automatic and untested.** The AppImage is made unattended when upstream publishes a
            > release, and nothing here plays the game: a build can be broken, or build a game that will not start.
            > If it does, please **open an issue** on this repository saying which version this is
            > (`${{ steps.version.outputs.tag }}`).

            The Linux AppImage of ProjectReLink ${{ steps.version.outputs.tag }} (x86_64, glibc 2.35 and newer).

            It carries the builder, its compiler, Python, FFmpeg, SDL2 and the Vulkan back end: the game is built on
            your own PC from your own copy, and no game data is in it.

            **To play:** make it executable, then run it. With no argument it opens a window: pick your `.nup` (or the
            `romfs` and `exefs` folders), where to build, the language, and it builds with a progress bar. Any argument
            goes to `nx2/make_game.py` as it is (`--help` lists them).

            Built from `${{ github.sha }}` on Ubuntu 22.04.
          files: build-linux/*.AppImage
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
