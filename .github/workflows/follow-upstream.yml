# Follow upstream, hourly: when pixl27/ProjectReLink publishes a new release tag, merge it into this fork's main.
#
# The Linux AppImage is built by linux-appimage.yml on every push to main, so the merge IS what starts the build: a
# quiet hour runs this job alone (about twenty seconds) and nothing else. A merge that conflicts stops here, so no
# AppImage is ever produced from a half-merged upstream.
name: Follow upstream
on:
  # Four tries an hour, at :07, :22, :37 and :52. GitHub's scheduler is best effort: it delays runs when its runners
  # are busy and DROPS some outright, most often at the top of the hour. One try an hour lost eight in a row on
  # 2026-11-16 (02:47 then 11:34, while upstream had released v0.7.8 at 05:12), so there are four, off the hour.
  # A try that finds nothing costs about twenty seconds and builds nothing.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # (to ask for the AppImage build: see below)
concurrency:
  group: follow-upstream
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Is there a newer upstream release?
        id: check
        run: |
          set -e
          git remote add upstream https://github.com/pixl27/ProjectReLink.git
          git fetch --quiet --tags upstream
          # (only plain vX.Y.Z: the fork's older "-linux.N" tags are not versions, and neither is any other suffix)
          upstream_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          ours=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "upstream=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "ours=$ours" >> "$GITHUB_OUTPUT"
          if [ "$upstream_tag" = "$ours" ]; then
            echo "new=no" >> "$GITHUB_OUTPUT"
            echo "this fork is on $ours, upstream's newest release: nothing to do"
          else
            echo "new=$upstream_tag" >> "$GITHUB_OUTPUT"
            echo "upstream released $upstream_tag, this fork is on $ours: merging"
          fi

      - name: Merge it into main
        if: steps.check.outputs.new != 'no'
        run: |
          set -e
          git config user.name "ReLink Linux build"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit "${{ steps.check.outputs.new }}"
          # (the tags go too: the AppImage workflow names each release after the newest upstream tag it contains)
          git push origin --tags
          git push origin HEAD:main

      # A push made with GITHUB_TOKEN does NOT start another workflow: GitHub's anti-recursion rule, and the merge above
      # is exactly that kind of push. So the build is asked for here, by name. (The first run of this workflow merged
      # v0.7.6 and started nothing, which is how this was found.)
      - name: Start the AppImage build
        if: steps.check.outputs.new != 'no'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run linux-appimage.yml --repo "${{ github.repository }}" --ref main

      - name: Say what happened
        if: steps.check.outputs.new != 'no'
        run: |
          echo "### Merged \`${{ steps.check.outputs.new }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The Linux AppImage build starts on its own: it runs on every push to \`main\`." >> "$GITHUB_STEP_SUMMARY"

      # Four tries an hour that find nothing would fill the Actions tab with runs that did nothing. A run cannot
      # delete itself (GitHub answers 403 while it is in progress), so each try takes the EARLIER ones off the list:
      # what stays is only the runs that merged a release, plus the one in progress.
      - name: Take the earlier checks that found nothing off the list
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          gh api "repos/$repo/actions/workflows/follow-upstream.yml/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" 2>/dev/null |
          while read -r id; do
            [ -n "$id" ] || continue
            merged=$(gh api "repos/$repo/actions/runs/$id/jobs" \
                       --jq '[.jobs[].steps[] | select(.name == "Merge it into main") | .conclusion] | first // ""' 2>/dev/null)
            if [ "$merged" = "skipped" ]; then
              gh api -X DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1 && echo "removed $id: it found nothing"
            fi
          done
          echo "done"
